name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'secret-frontier-playable-prototype.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack playable prototype
        run: |
          test -f secret-frontier-playable-prototype.zip
          unzip -q secret-frontier-playable-prototype.zip
          if [ -f grok-workspace-edit/package.json ]; then
            echo "PROJECT_DIR=grok-workspace-edit" >> "$GITHUB_ENV"
          elif [ -f package.json ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not locate package.json after extracting prototype ZIP"
            find . -maxdepth 3 -name package.json -print
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build mobile web app
        run: npm run mobile:build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Provide Capacitor entry point
        run: cp mobile-dist/mobile.html mobile-dist/index.html
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Create Android project
        run: npx cap add android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Sync web assets into Android project
        run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secret-frontier-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
