name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'grok-workspace-mobile-cloud-apk.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack game project
        run: |
          test -f grok-workspace-mobile-cloud-apk.zip
          unzip -q grok-workspace-mobile-cloud-apk.zip
          test -f grok-workspace-edit/package.json
          test -f grok-workspace-edit/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        working-directory: grok-workspace-edit
        run: npm install

      - name: Install Capacitor tooling
        working-directory: grok-workspace-edit
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build mobile web app
        working-directory: grok-workspace-edit
        run: npm run mobile:build

      - name: Create Android project
        working-directory: grok-workspace-edit
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: grok-workspace-edit
        run: npx cap sync android

      - name: Build debug APK
        working-directory: grok-workspace-edit/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secret-frontier-debug-apk
          path: grok-workspace-edit/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
